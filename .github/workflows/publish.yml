name: publish to npmjs

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20' # Stick to LTS to avoid the 'engine' warning
          registry-url: 'https://registry.npmjs.org'
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - run: pnpm i --frozen-lockfile


      - name: Debug npm authentication
        run: |
          npm whoami
          npm config get registry

      - name: Publish to npm
        # No 'env' block with secrets is needed! 
        # The 'id-token: write' permission handles the auth.
        run: npm publish --no-git-checks --access public