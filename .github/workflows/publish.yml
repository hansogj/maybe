name: Publish Package

on:
  push:
    tags:
      - 'v*' # This workflow runs when a version tag (e.g., v1.0.0) is pushed

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Allows checking out the code
      id-token: write # Required for OIDC authentication
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20' # Use your desired Node.js version
          registry-url: 'https://registry.npmjs.org' # Must be set for npmjs
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test
      - run: npm publish --provenance # The --provenance flag is recommended for security
