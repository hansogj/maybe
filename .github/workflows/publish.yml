name: publish to npmjs
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22' # Changed to LTS (Stable)
      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - run: pnpm i --frozen-lockfile
      
      # Optional: Explicitly run build if not handled by 'prepublishOnly' in package.json
      # - run: pnpm build 

      - run: pnpm publish --provenance --no-git-checks --access public
 
