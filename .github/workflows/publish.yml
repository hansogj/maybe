name: publish to npmjs

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20' # Stick to LTS to avoid the 'engine' warning
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - run: pnpm i --frozen-lockfile

      - name: Configure npm for Trusted Publishing
        # This manually points the npm client to use the OIDC token exchange
        run: |
          npm config set //registry.npmjs.org/:token-exchange-url https://www.npmjs.com/-/oauth/token
          # We set the auth token to an empty string so npm knows NOT to look 
          # for a secret, but to use the environment's OIDC token instead.
          npm config set //registry.npmjs.org/:_authToken "" 

      - name: Publish to npm
        # No 'env' block with secrets is needed! 
        # The 'id-token: write' permission handles the auth.
        run: pnpm publish --no-git-checks --access public --provenance