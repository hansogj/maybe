name: Publish Package to npm

on:
  push:
    tags:
      - 'v*' # Triggers the workflow when a tag starting with 'v' is pushed

permissions:
  id-token: write # Required for OIDC authentication
  contents: read # Allows checking out the code

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10 # Specify your pnpm version
          run_install: false # Avoids running pnpm install here if you do it later

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Specify your Node.js version
          registry-url: 'https://registry.npmjs.org' # Important for npm registry

      - name: Install dependencies
        run: pnpm install --frozen-lockfile # Use pnpm for installation

      - name: Build package
        run: pnpm run build --if-present

      - name: Test
        run: pnpm test --if-present

      - name: Publish to npm
        # No NPM_TOKEN secret needed due to OIDC and trusted publishing
        run: pnpm publish --no-git-checks --access public # Use pnpm publish command
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # This line is a placeholder; OIDC handles auth.
          # The setup-node action will create an .npmrc file referencing a token derived from OIDC
          # You might optionally set NPM_CONFIG_PROVENANCE: true here if using hosted runners
